[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "dependency-injector==4.49.0",
    "fastapi==0.135.3",
    "psycopg2==2.9.11",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "ty>=0.0.31",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]




[tool.uv.scripts]
lint = "ruff check ."
lint-diff = "ruff check . --diff"
fix = "ruff check . --fix"
format-check = "ruff format --check ."
format = "ruff format ."
